name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download adult-site blocklist
        run: |
          set +e
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts \
            -o /tmp/porn-hosts.txt
          if [ -s /tmp/porn-hosts.txt ]; then
            grep -E '^0\.0\.0\.0[[:space:]]+' /tmp/porn-hosts.txt | awk '{print $2}' \
              | grep -v '^0\.0\.0\.0$' | sort -u > app/src/main/assets/adult_hosts.txt
          fi
          echo "Blocklist entries: $(wc -l < app/src/main/assets/adult_hosts.txt)"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk focus-guard-1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Focus Guard 1.0.${{ github.run_number }}
          files: focus-guard-1.0.${{ github.run_number }}.apk
          make_latest: true
          body: Built from ${{ github.sha }}. Install or update with Obtainium.
